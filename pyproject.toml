[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-explorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "numpy",
    "datasets",
    "accelerate",
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "sentence-transformers>=6.1.0",
    "umap-learn>=0.5.12",
]

[project.scripts]
neuron-explorer = "neuron_explorer.explorer.cli:main"
neuron-plot-attribution = "neuron_explorer.attribution.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neuron_explorer.explorer" = ["static/*", "prompts/*.md"]
