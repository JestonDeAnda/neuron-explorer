[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-explorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "numpy",
    "datasets",
    "accelerate",
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "sentence-transformers>=6.1.0",
    "umap-learn>=0.5.12",
]

[project.scripts]
neuron-explorer = "scripts.serve_explorer:main"
neuron-plot-attribution = "scripts.plot_attribution:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools]
packages = [
    "neuron_explorer",
    "neuron_explorer.attribution",
    "neuron_explorer.attribution.huginn",
    "neuron_explorer.attribution.moe",
    "neuron_explorer.attribution.moe.xllm_huginn",
    "neuron_explorer.explorer",
    "neuron_explorer.sweep",
    "neuron_explorer.tools",
    "scripts",
]
package-dir = {neuron_explorer = "src/neuron_explorer", scripts = "scripts"}
include-package-data = true

[tool.setuptools.package-data]
"neuron_explorer.explorer" = ["static/*", "prompts/*.md"]
